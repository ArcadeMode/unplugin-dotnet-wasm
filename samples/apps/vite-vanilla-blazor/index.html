<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazor elements · Vite</title>
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-800">
    <main class="mx-auto max-w-3xl px-6 py-16">
      <p class="text-sm text-stone-500">Vite · Blazor</p>
      <h1 class="mt-1 text-lg font-normal">Custom elements in a Vite page</h1>
      <!--
        Registered via RegisterCustomElement<T>(). Parameters are set from
        src/entry.ts (JS properties); CountChanged is the `countchanged` event.
      -->
      <div class="mt-8 grid gap-6 sm:grid-cols-2">
        <section class="rounded-xl bg-white p-8 ring-1 ring-stone-200">
          <h2 class="text-sm text-stone-500">Counter</h2>
          <div class="mt-4">
            <blazor-counter></blazor-counter>
          </div>
        </section>
        <section class="rounded-xl bg-white p-8 ring-1 ring-stone-200">
          <h2 class="text-sm text-stone-500">Date / time</h2>
          <div class="mt-4">
            <blazor-date-time-now></blazor-date-time-now>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
