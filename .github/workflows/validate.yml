name: Validate

on:
  pull_request:
  workflow_call:
    outputs:
      badge-color:
        description: 'Color for the test results badge'
        value: ${{ jobs.publish-results.outputs.badge-color }}
      badge-message:
        description: 'Text for the test results badge'
        value: ${{ jobs.publish-results.outputs.badge-message }}
defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Run unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - run: pnpm install

      - name: Build plugin
        run: pnpm build:plugin

      - name: Build fixture
        run: pnpm build:sample

      - name: Run unit tests
        run: pnpm test:unit

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-unit-${{ matrix.os }}
          path: unplugin-dotnet-wasm/test-results/

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - run: pnpm install

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  matrix:
    name: Run integration tests
    needs: [unit, format]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        platform: [node, browser]
        fingerprint: ['true'] # only with fingerprinting enabled
        build_mode: [debug, publish]
        include: # + two smoke tests without fingerprinting (limit the number of jobs)
          - os: ubuntu-latest
            platform: browser
            fingerprint: 'false'
            build_mode: publish
          - os: windows-latest
            platform: node
            fingerprint: 'false'
            build_mode: debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install

      - name: Build plugin
        run: pnpm build:plugin

      - name: Build library
        run: |
          if [ "${{ matrix.build_mode }}" = "publish" ]; then
            pnpm publish:library:${{ matrix.fingerprint == 'true' && 'fingerprint' || 'nofingerprint' }}
          else
            pnpm build:library:${{ matrix.fingerprint == 'true' && 'fingerprint' || 'nofingerprint' }}
          fi

      - name: Build fixtures
        run: pnpm build:fixtures --mode=${{ matrix.build_mode == 'publish' && 'release' || 'debug' }} --platform=${{ matrix.platform }}

      - name: Install Playwright browsers
        if: matrix.platform == 'browser'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm --dir test/integration exec playwright install --with-deps chromium
          else
            pnpm --dir test/integration exec playwright install chromium
          fi

      - name: Run integration tests
        run: pnpm test:matrix --integration --platform=${{ matrix.platform }} --fingerprint=${{ matrix.fingerprint }} --build-mode=${{ matrix.build_mode }}

      - name: Run e2e tests (dist)
        run: pnpm test:matrix --e2e --serve-mode=dist --platform=${{ matrix.platform }} --fingerprint=${{ matrix.fingerprint }} --build-mode=${{ matrix.build_mode }}

      - name: Move test results # protect results from being overwritten by the next test run
        run: mv test/integration/test-results test/integration/test-results-dist

      - name: Clean fixture dists # ensure the dev server tests are not using the dist files
        run: pnpm clean:fixture
      - name: Run e2e tests (dev server)
        run: pnpm test:matrix --e2e --serve-mode=server --platform=${{ matrix.platform }} --fingerprint=${{ matrix.fingerprint }} --build-mode=${{ matrix.build_mode }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.fingerprint }}-${{ matrix.build_mode }}
          path: |
            test/integration/test-results/
            test/integration/test-results-dist/

  matrix-none:
    name: Run integration tests (no build)
    needs: [unit, format]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install

      - name: Build plugin
        run: pnpm build:plugin

      - name: Clean library
        run: pnpm clean:library

      - name: Run test matrix
        run: pnpm test:matrix --fingerprint=false --build-mode=none --integration

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-none
          path: test/integration/test-results/

  publish-results:
    name: Publish test results
    needs: [unit, format, matrix, matrix-none]
    outputs:
      badge-color: ${{ steps.badge.outputs.color }}
      badge-message: ${{ steps.badge.outputs.message }}
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: results

      - name: Publish test results
        id: test-results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            results/**/*.junit.xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: all-test-results
          path: results/

      - name: Determine badge content
        id: badge
        shell: pwsh
        run: |
          $color = if ("${{ fromJSON(steps.test-results.outputs.json).conclusion }}" -eq "success") { '#26cc23' } else { '#cc5623' }
          $message = if ("${{ fromJSON(steps.test-results.outputs.json).conclusion }}" -eq "success") { "${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.runs_succ }} passing" } else { "${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.runs_fail }}/${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.runs }} failing" }
          "color=$color" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "message=$message" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
