name: Validate

on:
  pull_request:
  workflow_call:
    outputs:
      badge-color:
        description: 'Color for the test results badge'
        value: ${{ jobs.publish-results.outputs.badge-color }}
      badge-message:
        description: 'Text for the test results badge'
        value: ${{ jobs.publish-results.outputs.badge-message }}
defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Run unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - run: pnpm install

      - name: Build plugin
        run: pnpm build:plugin

      - name: Build fixture
        run: pnpm build:sample

      - name: Run unit tests
        run: pnpm test:unit

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-unit-${{ matrix.os }}
          path: unplugin-dotnet-wasm/test-results/

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  e2e-fixture:
    name: Run fixture-builder e2e
    needs: [unit, format]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        bundler: [vite, webpack, esbuild, rollup, rolldown, rspack, rsbuild, farm, bun]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Warm up .NET SDK
        run: dotnet --info

      - uses: oven-sh/setup-bun@v2
        if: matrix.bundler == 'bun'

      - run: pnpm install

      - name: Build plugin
        run: pnpm build:plugin

      - name: Install Playwright browsers
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm --filter @dotnet-wasm-bundler/e2e exec playwright install --with-deps chromium
          else
            pnpm --filter @dotnet-wasm-bundler/e2e exec playwright install chromium
          fi

      - name: Run e2e
        #env:
        #  FIXTURE_ECHO_LOGS: ${{ matrix.bundler == 'farm' && '1' || '' }}
        run: pnpm --filter @dotnet-wasm-bundler/e2e test:e2e --bundler=${{ matrix.bundler }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-e2e-${{ matrix.os }}-${{ matrix.bundler }}
          path: test/e2e/test-results/

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-traces-${{ matrix.os }}-${{ matrix.bundler }}
          path: test/e2e/test-results/**/trace.zip
          if-no-files-found: ignore

  publish-results:
    name: Publish test results
    needs: [unit, format, e2e-fixture]
    outputs:
      badge-color: ${{ steps.badge.outputs.color }}
      badge-message: ${{ steps.badge.outputs.message }}
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: results

      - name: Publish test results
        id: test-results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            results/**/*.junit.xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: all-test-results
          path: results/

      - name: Determine badge content
        id: badge
        shell: pwsh
        run: |
          $color = if ("${{ fromJSON(steps.test-results.outputs.json).conclusion }}" -eq "success") { '#26cc23' } else { '#cc5623' }
          $message = if ("${{ fromJSON(steps.test-results.outputs.json).conclusion }}" -eq "success") { "${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.runs_succ }} passing" } else { "${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.runs_fail }}/${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.runs }} failing" }
          "color=$color" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "message=$message" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
