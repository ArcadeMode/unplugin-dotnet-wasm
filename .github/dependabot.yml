version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: 'UTC'
    cooldown:
      default-days: 2
    open-pull-requests-limit: 6
    labels:
      - dependencies
    groups:
      dotnet-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      dotnet-major:
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:15'
      timezone: 'UTC'
    cooldown:
      default-days: 2
    open-pull-requests-limit: 6
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: 'UTC'
    cooldown:
      default-days: 2
    open-pull-requests-limit: 6
    labels:
      - dependencies
    groups:
      actions-all:
        patterns:
          - '*'
